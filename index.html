<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Galeria de Fotos</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-menu">
    <button class="btn menu-button" type="button" id="background-menu-button" aria-expanded="false" aria-controls="background-options">
      <span class="menu-icon" aria-hidden="true">&#9776;</span>
      Fundos
    </button>
    <div class="background-options d-none" id="background-options">
      <button type="button" data-background="one">Fundo 1</button>
      <button type="button" data-background="two">Fundo 2</button>
    </div>
  </div>

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="view login-view card shadow p-4 p-md-5" data-view="login">
      <h1 class="h2">Galeria de Fotos</h1>
      
      <form id="login-form">
        <label class="form-label mt-3" for="username">Usuário</label>
        <input class="form-control" type="text" id="username" placeholder="Digite seu usuário">

        <label class="form-label mt-3" for="password">Senha</label>
        <input class="form-control" type="password" id="password" placeholder="Digite sua senha">

        <div id="message" class="small mt-3" role="alert"></div>
        <button class="btn btn-primary w-100 mt-2" type="submit" id="login-button">Entrar</button>
      </form>
    </section>

    <section class="view gallery-view card shadow p-4 p-md-5 d-none" data-view="gallery">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h1 class="h2">Bem-vindo, <span id="user-name"></span>!</h1>
          <p class="text-secondary">Escolha uma foto para visualizar.</p>
        </div>
        <button class="btn btn-primary" type="button" id="logout-button">Sair</button>
      </div>
      <p class="text-muted mb-2" id="photos-status" aria-live="polite"></p>
      <div class="list-group" id="photo-list"></div>
    </section>

    <section class="view photo-detail-view card shadow p-4 p-md-5 d-none" data-view="photo-detail">
      <button class="btn btn-primary mb-4 align-self-start" type="button" id="back-button">Voltar</button>
      <h1 class="h2" id="photo-title"></h1>
      <img class="img-fluid rounded mx-auto d-block" id="photo-image" alt="">
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
